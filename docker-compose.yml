services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${APP_PORT:-8080}:8080"

  frontend:
    build: ./frontend
    depends_on:
      - app
    environment:
      # Server-side only (no NEXT_PUBLIC_ prefix): resolved by the Next.js
      # server's own Route Handlers acting as a backend-for-frontend proxy.
      # Uses the backend's Compose service name, not localhost — the browser
      # never talks to this URL directly, only same-origin to the frontend.
      API_BASE_URL: http://app:8080
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  mysql-data:
